[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "eval-decision-audit"
version = "0.1.0"
description = "Auditable paired comparisons of evaluation quality and cost."
requires-python = ">=3.11"
dependencies = []

[project.scripts]
eval-decision-audit = "eval_decision_audit.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
